name: Tests

on: [push, pull_request]

jobs:
  preview-and-session-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python test_demo_app.py
      - run: python -m unittest -q test_main_app.py
      - run: python -m unittest -q test_conversation_store.py
      - run: python -m json.tool 'cse6242_project(frontend)/webpage/eval/benchmark.json' > /dev/null
